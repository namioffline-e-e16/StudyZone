<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-box">
            <h1>Welcome to StudyZone.</h1>
            <p>Your personal study space ✨</p>
            <button id="enter-btn">Enter</button>

            <footer>
                made by; nami-e_e
            </footer>
        </div>
    </div>

    <!-- Main Website -->
    <div id="main-content" class="hidden">

        <header>
            <h1>📚 StudyZone</h1>
            <p id="quote">
                "Success is the sum of small efforts repeated daily."
            </p>
        </header>

        <div class="container">

            <!-- Pomodoro -->
            <section class="card">
                <h2>⏱️ Pomodoro Timer</h2>
                <h1 id="timer">25:00</h1>

                <div class="timer-buttons">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="resetTimer()">Reset</button>
                </div>
            </section>

            <!-- Todo List -->
            <section class="card">
                <h2>✅ To-Do List</h2>

                <input type="text" id="taskInput"
                placeholder="Add a task...">

                <button onclick="addTask()">Add Task</button>

                <ul id="taskList"></ul>
            </section>

            <!-- Lesson Summarizer -->
            <section class="card">
                <h2>📝 Lesson Summarizer</h2>

                <textarea id="lessonText"
                placeholder="Paste your lesson here..."></textarea>

                <input type="file"
                id="lessonFile"
                accept=".txt">

                <button onclick="summarizeLesson()">
                    Summarize Lesson
                </button>

                <h3>Summary:</h3>
                <p id="summaryOutput"></p>
            </section>

            <!-- Flashcards -->
            <section class="card">
                <h2>🧠 Flashcards</h2>

                <button onclick="generateFlashcards()">
                    Generate Flashcards
                </button>

                <div id="flashcards"></div>
            </section>

            <!-- Focus Mode -->
            <section class="card">
                <h2>🚫 Distraction Blocker</h2>

                <button onclick="focusMode()">
                    Turn On Focus Mode
                </button>

                <p id="focusText"></p>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
